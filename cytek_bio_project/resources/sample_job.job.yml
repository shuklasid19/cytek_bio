# A sample job for cytek_bio_project.

resources:
  jobs:
    sample_job:
      name: sample_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: ../src/sample_notebook.ipynb
        - task_key: python_wheel_task
          depends_on:
            - task_key: notebook_task
          python_wheel_task:
            package_name: cytek_bio_project
            entry_point: main
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
          environment_key: default
        - task_key: refresh_pipeline
          depends_on:
            - task_key: notebook_task
          pipeline_task:
            pipeline_id: ${resources.pipelines.cytek_bio_project_etl.id}

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              # By default we just include the .whl file generated for the cytek_bio_project package.
              # See https://docs.databricks.com/dev-tools/bundles/library-dependencies.html
              # for more information on how to add other libraries.
              - ../dist/*.whl
              - resources:
  jobs:
    sample_job:
      name: "[${bundle.target}] Sample Job"

      # 🏷️ JOB COST TAGS — adds to Workflows UI → Tags tab
      tags:
        project:     cytek_bio_project
        team:        data-engineering
        env:         ${bundle.target}
        cost_center: ${var.cost_center}
        owner:       ${var.owner}
        resource:    job

      tasks:
        - task_key: main_task
          job_cluster_key: job_cluster
          notebook_task:
            notebook_path: ../src/your_notebook.py
            base_parameters:
              catalog: ${var.catalog}
              schema:  ${var.schema}
              env:     ${bundle.target}

      job_clusters:
        - job_cluster_key: job_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id:  i3.xlarge
            num_workers: 2
            aws_attributes:
              availability: SPOT_WITH_FALLBACK
              spot_bid_price_percent: 80

            # 🏷️ CLUSTER COST TAGS — shows in Compute UI → Tags tab
            custom_tags:
              project:     cytek_bio_project
              team:        data-engineering
              env:         ${bundle.target}
              cost_center: ${var.cost_center}
              owner:       ${var.owner}
              resource:    cluster
