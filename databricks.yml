bundle:
  name: cytek_bio_project
  uuid: 78b61fcd-fd76-4bce-9342-f0d7231348c4

include:
  - cytek_bio_project/resources/*.yml
  - cytek_bio_project/resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  cost_center:
    description: Cost center for billing
    default: data-engineering
  owner:
    description: Team owner
    default: shuklasiddharth74@gmail.com
  project:
    description: Project name
    default: cytek_bio_project

targets:

  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-915390d7-3bdb.cloud.databricks.com/
    variables:
      catalog:     workspace
      schema:      dev
      cost_center: data-engineering
      owner:       shuklasiddharth74@gmail.com

  prod:
    mode: production
    workspace:
      host: https://dbc-915390d7-3bdb.cloud.databricks.com/
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog:     workspace
      schema:      prod
      cost_center: data-engineering
      owner:       shuklasiddharth74@gmail.com
    permissions:
      - user_name: shuklasiddharth74@gmail.com
        level: CAN_MANAGE