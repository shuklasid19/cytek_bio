# Databricks Asset Bundle for cytek_bio_project
bundle:
  name: cytek_bio_project
  uuid: 78b61fcd-fd76-4bce-9342-f0d7231348c4

# Load resource definitions from separate files
include:
  - resources/*.yml
  - resources/*/*.yml

# Python wheel artifact
artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# ── VARIABLES ──────────────────────────────────────
variables:
  catalog:
    description: The catalog to use
    default: workspace

  schema:
    description: The schema to use
    default: dev

  cost_center:
    description: Cost center for billing
    default: data-engineering

  owner:
    description: Team owner
    default: shuklasiddharth74@gmail.com
    variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

  # ── ADD THESE ──
  cost_center:
    description: Cost center for billing
    default: data-engineering

  owner:
    description: Team owner
    default: shuklasiddharth74@gmail.com

  project:
    description: Project name
    default: cytek_bio_project

# ── TARGETS ────────────────────────────────────────
targets:

  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-915390d7-3bdb.cloud.databricks.com/
    variables:
      catalog: workspace
      schema:  dev

  prod:
    mode: production
    workspace:
      host: https://dbc-915390d7-3bdb.cloud.databricks.com/
      # ✅ Fixed: use shared path instead of personal folder
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema:  prod
    permissions:
      - user_name: shuklasiddharth74@gmail.com
        level: CAN_MANAGE