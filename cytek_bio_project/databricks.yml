# This is a Databricks asset bundle definition for cytek_bio_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: cytek_bio_project
  uuid: 78b61fcd-fd76-4bce-9342-f0d7231348c4

include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-915390d7-3bdb.cloud.databricks.com/
    variables:
      catalog: workspace
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-915390d7-3bdb.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/shuklasiddharth74@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/shuklasiddharth74@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: shuklasiddharth74@gmail.com
        level: CAN_MANAGE
