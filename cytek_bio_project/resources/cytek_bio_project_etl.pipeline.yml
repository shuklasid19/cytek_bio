resources:
  pipelines:
    cytek_bio_project_etl:
      name: "[${bundle.target}] Cytek Bio ETL Pipeline"
      catalog: ${var.catalog}
      target:  ${var.schema}
      development: ${bundle.target == 'dev'}
      continuous: false

      # 🏷️ Pipeline cost tags
      configuration:
        project:     ${var.project}
        team:        data-engineering
        env:         ${bundle.target}
        cost_center: ${var.cost_center}
        owner:       ${var.owner}

      libraries:
        - notebook:
            path: ../src/dlt_pipeline.py

      clusters:
        - label: default
          num_workers: 2
          custom_tags:
            project:     ${var.project}
            env:         ${bundle.target}
            cost_center: ${var.cost_center}
            owner:       ${var.owner}