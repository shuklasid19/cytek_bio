resources:
  jobs:
    sample_job:
      name: "[${bundle.target}] Sample Job"

      # 🏷️ Job cost tags
      tags:
        project:     ${var.project}
        team:        data-engineering
        env:         ${bundle.target}
        cost_center: ${var.cost_center}
        owner:       ${var.owner}

      tasks:
        - task_key: main_task
          job_cluster_key: job_cluster
          notebook_task:
            notebook_path: ../src/notebook.py
            base_parameters:
              catalog: ${var.catalog}
              schema:  ${var.schema}
              env:     ${bundle.target}

      job_clusters:
        - job_cluster_key: job_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id:  i3.xlarge
            num_workers: 2
            custom_tags:
              project:     ${var.project}
              env:         ${bundle.target}
              cost_center: ${var.cost_center}
              owner:       ${var.owner}